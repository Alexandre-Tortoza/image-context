[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-context"
version = "0.1.0"
description = "Sample images from ROS bags and enrich them with VLM, Grounding DINO, and SAM2."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "rosbags>=0.9",
]

[project.optional-dependencies]
models = [
    "accelerate>=0.34",
    "bitsandbytes>=0.43",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.57",
]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[project.scripts]
image-context = "image_context.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["image_context"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = [
    "accelerate.*",
    "bitsandbytes.*",
    "cv2.*",
    "PIL.*",
    "torch.*",
    "transformers.*",
]
ignore_missing_imports = true
follow_imports = "skip"
