dataset:
  bag_path: ../vlm-cotext-map/dataset/Corridor02/corridor02.bag
  image_topic: /camera_1/image_raw
  sample_size: 10
  seed: 42

qwen:
  checkpoint: Qwen/Qwen3-VL-4B-Instruct
  quantization: int4
  device: cuda
  max_new_tokens: 2048

grounding:
  checkpoint: IDEA-Research/grounding-dino-base
  device: cuda
  box_threshold: 0.30
  text_threshold: 0.25
  nms_iou_threshold: 0.60
  fallback_box_threshold: 0.40
  maximum_detections_per_concept: 3

sam2:
  checkpoint: facebook/sam2.1-hiera-tiny
  device: cuda

region_first:
  feature_checkpoint: facebook/dinov2-small
  feature_device: cuda
  discovery_grid_size: 4
  maximum_regions: 12
  minimum_region_area_fraction: 0.002
  maximum_region_area_fraction: 0.80
  minimum_region_confidence: 0.70
  minimum_region_stability: 0.90
  mask_iou_threshold: 0.85

minimum_concept_confidence: 0.60
indoor_fallback_queries:
  - robot
  - wheel
  - door
  - doorway
  - exit sign
  - window
  - floor
  - wall
  - ceiling light
  - debris
outdoor_fallback_queries:
  - robot
  - wheel
  - building
  - tree
  - pole
  - road
output_directory: runs
run_id: corridor02-sample
